services:
  postgres:
    image: postgres:16
    container_name: guidegenie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guidegenie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guidegenie}
      POSTGRES_DB: ${POSTGRES_DB:-guidegenie}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - guidegenie_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guidegenie}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  guidegenie_pgdata:
